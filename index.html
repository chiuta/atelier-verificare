<style>:root{--h:20;color-scheme:dark;

*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}

.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--glow);animation:ping 2.2s infinite}
h1{margin:0;font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.02;letter-spacing:-.02em;font-weight:850;overflow-wrap:anywhere;

.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--glow)}
.btn.pri{background:var(--btn);color:var(--btntx);border-color:transparent}

.chips b{display:block;color:var(--tx);font-size:1.08rem;line-height:1.25}
.art{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin:0 auto;color:var(--ac)}
.art svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 12px 40px var(--glow))}
.halo{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);animation:breathe 6s ease-in-out infinite}

.rock{transform-box:fill-box;transform-origin:50% 0;animation:rock 5s ease-in-out infinite}
.spin{transform-box:view-box;transform-origin:200px 200px;animation:spin 60s linear infinite}.spin2{transform-box:view-box;transform-origin:200px 200px;animation:spin 24s linear infinite reverse}
.d0{animation-delay:0s}.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}.d7{animation-delay:.7s}.d8{animation-delay:.8s}.d9{animation-delay:.9s}.d10{animation-delay:1s}.d11{animation-delay:1.1s}.d12{animation-delay:1.2s}.d13{animation-delay:1.3s}.d14{animation-delay:1.4s}.d15{animation-delay:1.5s}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}

@keyframes breathe{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}

#content{max-width:1120px;margin:0 auto;padding:8px 20px 40px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.code code{background:none;border:0;padding:0}.two>*{min-width:0}.card{min-width:0}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:26px 28px;position:relative}
.card h2{margin:0 0 12px;font-size:1.5rem;letter-spacing:-.01em}
.card p{margin:.5em 0;max-width:68ch}.card .note{color:var(--mut);font-size:.95rem}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;background:var(--code);padding:.12em .42em;border-radius:6px;border:1px solid var(--line)}
.code{position:relative;margin:12px 0;background:var(--code);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.code pre{margin:0;padding:16px 18px;overflow-x:auto;font:.9rem/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--tx)}
.code pre::before{content:"$";color:var(--ac);margin-right:.8em;float:left}
.code .cp{position:absolute;top:8px;right:8px;font-size:.78rem;padding:4px 10px;min-height:28px}
.json pre::before{content:none}
.k{color:var(--ac)}.s{color:var(--ac2)}.n{color:var(--link)}
.steps{list-style:none;counter-reset:s;margin:14px 0 4px;padding:0;display:grid;gap:12px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--btn);color:var(--btntx)}
.tasks{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.tasks li{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.tasks li:hover{transform:translateY(-2px);border-color:var(--ac)}
.tasks .no{font-size:.8rem;color:var(--ac);font-weight:800;letter-spacing:.08em}
.tag{display:inline-block;margin:0 6px 0 0;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:.76rem;color:var(--mut)}
.ring{position:absolute;right:24px;top:22px;width:74px;height:74px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring text{transform:rotate(90deg);transform-origin:center}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--mut);font-weight:650;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
.req{color:var(--ac);font-weight:700;font-size:.8rem}
.tblw{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}

.vrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}

<style id="app-style">/* ATELIER DE VERIFICARE · stiluri pentru secțiunea aplicației (doar clase; politica CSP interzice atributele style) */
.at-intro{max-width:72ch}
.at-banner{max-width:78ch;border-left:3px solid var(--ac);padding:4px 0 4px 10px;margin:10px 0 4px}
.at-sec{margin:22px 0 0}
.at-sec h3,#app .at-sec h3{margin:0 0 8px;font-size:1.15rem}
.at-sec h4{margin:16px 0 6px;font-size:1rem}
.at-f{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:.9rem;color:var(--mut);min-width:0;max-width:100%}
.at-f>span{font-weight:650}
.at-inp{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:1rem;min-height:44px;padding:8px 10px;width:100%;max-width:72ch;box-sizing:border-box}
.at-inp:hover{border-color:var(--ac)}
textarea.at-inp{resize:vertical;min-height:84px}
.at-filein{font:inherit;color:var(--tx);max-width:100%}
.at-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.at-small{padding:4px 12px;min-height:36px;font-size:.84rem}
.at-drop{border:2px dashed var(--line);border-radius:14px;padding:14px 16px;margin:8px 0}
.at-drop p{margin:0 0 6px}
.at-drop.at-over{border-color:var(--ac);background:var(--bg2)}
.at-chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;max-width:78ch;cursor:pointer}
.at-chk input{width:22px;height:22px;flex:none;margin-top:2px}
.at-svc{margin:6px 0 4px;padding-left:1.2em;max-width:78ch}
.at-svc li{margin:.35em 0}
.at-summary{margin:6px 0;font-weight:650}
.at-status{min-height:1.5em;margin:4px 0 10px;color:var(--mut)}
.at-empty{color:var(--mut)}
.at-item{border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:12px 14px;margin:14px 0}
.at-ihead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.at-thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
.at-imeta{flex:1 1 16em;min-width:0}
.at-imeta h4{margin:0 0 2px;font-size:1.05rem;overflow-wrap:anywhere}
.at-sub{margin:2px 0;color:var(--mut);font-size:.88rem;overflow-wrap:anywhere}
.at-hash{margin:4px 0;font-size:.86rem;overflow-wrap:anywhere}
.at-hash code{font-size:.8rem;word-break:break-all}
.at-links{margin:4px 0;font-size:.9rem}
.at-iact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.at-checks{margin-top:10px}
.at-check{border-top:1px solid var(--line);padding:10px 0 4px}
.at-chead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.at-chead h5{margin:0;font-size:.98rem;flex:1 1 12em}
.at-desc{margin:4px 0;color:var(--mut);font-size:.88rem;max-width:80ch}
.at-netnote{margin:4px 0;font-size:.86rem;border-left:3px solid var(--ac);padding-left:8px;max-width:80ch}
.at-err{margin:6px 0;font-weight:650}
.at-findings{list-style:none;margin:8px 0;padding:0;max-width:90ch}
.at-findings li{margin:4px 0;padding:6px 10px;border-left:4px solid var(--line);background:var(--card);border-radius:0 8px 8px 0;overflow-wrap:anywhere}
.at-findings li.lv-ok{border-left-color:#2e8b57}
.at-findings li.lv-info{border-left-color:#4a78c2}
.at-findings li.lv-warn{border-left-color:#c58a00}
.at-findings li.lv-fail{border-left-color:#d6453b}
.at-findings li.lv-skip{border-left-color:var(--line);color:var(--mut)}
.at-lv{font-weight:750;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.at-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:750;color:#fff;background:#555;white-space:nowrap}
.at-badge.lv-ok{background:#1f6f3f}
.at-badge.lv-info{background:#2d4f8a}
.at-badge.lv-warn{background:#7c5200}
.at-badge.lv-fail{background:#a3271f}
.at-badge.lv-skip,.at-badge.lv-error{background:#4a4a4a}
.at-badge.lv-run{background:#2d4f8a}
.at-arts{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}
.at-fig{margin:0;max-width:100%}
.at-fig figcaption{font-size:.8rem;color:var(--mut);margin:4px 0;max-width:28em}
.at-art{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#000}
.at-lim{max-width:80ch;padding-left:1.2em}
.at-lim li{margin:.4em 0}
.at-offscreen{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
#at-printroot{display:none}
@media print{
  body.at-printing>*{display:none!important}
  body.at-printing>#at-printroot{display:block!important;color:#000;background:#fff;font:12pt/1.45 serif;padding:0;margin:0}
  #at-printroot h1{font-size:20pt;margin:0 0 6pt}
  #at-printroot h2{font-size:14pt;margin:14pt 0 4pt;break-after:avoid}
  #at-printroot h3{font-size:12pt;margin:8pt 0 2pt;break-after:avoid}
  #at-printroot code{font:10pt monospace;word-break:break-all}
  #at-printroot li{break-inside:avoid}
}
</style>

"use strict";
var I18N={"ro":{"title":"Atelier de verificare","nav":"Atelierul","open":"Deschide atelierul","intro":"Verificări locale pentru imagini, clipuri video, linkuri și texte, înainte să le crezi sau să le publici: structura fișierului, EXIF și alte metadate, Content Credentials (C2PA), analiza nivelului de eroare, anatomia linkurilor, caractere ascunse. Totul rulează în browserul tău; nimic nu se încarcă nicăieri.","local_note":"Fișierele, linkurile și textele rămân pe acest dispozitiv. Singurele excepții sunt verificările opționale prin rețea de mai jos, care rulează numai după ce bifezi consimțământul și apeși butonul lor.","h_case":"Dosar","lbl_title":"Titlul dosarului","lbl_notes":"Note (apar în raport)","case_hint":"Titlul și notele se păstrează doar în acest browser. Fișierele, elementele și rezultatele nu se salvează: la reîncărcarea paginii dispar.","new_case":"Dosar nou (șterge tot)","new_case_confirm":"Apasă încă o dată ca să ștergi tot","h_add":"Adaugă materiale","drop":"Trage imagini sau clipuri oriunde pe pagină sau alege fișiere:","choose":"Alege fișiere","lbl_text":"Link, domeniu sau text (un link pe rând, ca să adaugi mai multe)","add":"Adaugă","examples":"Adaugă exemple","h_net":"Verificări prin rețea (opționale)","net_intro":"Aceste verificări cer un apel către un serviciu terț. Nu rulează niciodată de la sine.","net_note":"Trimite {0} către {1} numai când apeși butonul.","send_domain":"numele domeniului","send_url":"adresa","send_data":"datele","net_need":"Bifează mai întâi consimțământul din secțiunea «Verificări prin rețea».","consent":"Înțeleg că aceste verificări trimit datele descrise mai sus către serviciile enumerate, care vor vedea adresa mea IP și cererea. Accept, la fiecare apăsare de buton.","h_items":"Materiale","run_all":"Rulează toate verificările offline","run_net":"Rulează verificările prin rețea","clear_results":"Șterge rezultatele","summary":"{0} element(e) · {1} verificare(i) rulate · {2} cer atenție · {3} cu probleme","empty":"Nimic adăugat încă. Adaugă mai sus un fișier, un link sau un text.","run":"Rulează","rerun":"Rulează din nou","run_item":"Rulează verificările offline","remove":"Elimină","running":"Se execută…","reading":"Se citește fișierul…","hash_wait":"se calculează…","hash_big":"necalculat (fișier mai mare de 200 MB)","real_type":"tip real {0}","chars":"{0} caractere","add_links":"Adaugă ca elemente cele {0} link(uri) găsite","arch_save":"Cere Internet Archive să salveze pagina","arch_view":"Vezi copiile arhivate","copy":"Copiază","copied":"Copiat","copy_fail":"Nu s-a putut copia","save_png":"Salvează ca PNG","art_ela":"Harta nivelului de eroare: mai luminos = diferență mai mare după recomprimare","art_frame":"Cadrul {0} la {1} s","err_check":"Verificarea a eșuat: {0}","err_save":"Imaginea nu s-a putut salva.","h_report":"Raport","report_hint":"Raportul enumeră fiecare element și fiecare verificare rulată, în limba aleasă, cu data și limitele metodei. Rulează întâi verificările: un raport fără rezultate e gol.","b_rep_md":"Descarcă raportul (Markdown)","b_rep_print":"Tipărește / salvează ca PDF","b_rep_json":"Descarcă datele (JSON)","b_rep_copy":"Copiază datele (JSON)","r_kind":"Tip","r_size":"Mărime","r_real":"Tip real","r_modified":"Data fișierului (ultima modificare)","r_url":"Adresă","r_chars":"Caractere","r_untitled":"Raport de verificare","r_notes":"Note","r_generated":"Generat","r_tool":"Instrument","r_limits":"Limitele acestui raport","st_added":"{0} element(e) adăugat(e).","st_nothing":"Nimic de adăugat.","st_removed":"Element eliminat.","st_cleared":"Rezultate șterse.","st_new":"Dosar nou început.","st_saved":"Raport salvat.","st_running":"Rulez verificările offline…","st_running_net":"Rulez verificările prin rețea…","st_done":"Gata.","st_consent_on":"Verificările prin rețea sunt activate.","st_consent_off":"Verificările prin rețea sunt dezactivate.","h_limits":"Ce nu poate spune acest instrument","h_ethics":"Folosire responsabilă","h_more":"Mai departe","more_intro":"Nicio verificare automată nu dovedește că o imagine e autentică sau falsă. Îmbină rezultatele cu munca pe surse. Servicii independente pe care le deschizi singur (nu se trimite nimic până nu încarci tu ceva acolo):","lim_1":"Nu poate dovedi că o imagine sau un clip e autentic. Poate arăta doar indicii care susțin sau contrazic o afirmație.","lim_2":"Metadatele (EXIF, XMP, IPTC) se șterg, se copiază și se falsifică ușor. Absența lor spune puțin; prezența lor e o pistă, nu o dovadă. Rețelele sociale și aplicațiile de mesagerie le elimină în mare parte.","lim_3":"Content Credentials (C2PA) sunt citite, nu validate: semnătura, lanțul de certificate și amprenta conținutului nu se verifică aici. Pentru asta folosește un verificator oficial.","lim_4":"Analiza nivelului de eroare e un indiciu: luminează și muchiile ascuțite, zonele saturate și imaginile salvate de mai multe ori. Specialiștii o citesc împreună cu alte dovezi.","lim_5":"Verificarea linkurilor lucrează doar pe textul adresei. O pagină web nu poate urmări redirecționările, citi certificatele TLS sau deschide pagina țintă, deci nu poate spune dacă un site e de încredere.","lim_6":"Interogările DNS arată ce răspund acum două servere publice. Nu dau data înregistrării sau proprietarul unui domeniu.","lim_7":"Căutarea în Internet Archive spune doar dacă există o copie și ce stare avea; lipsa unei copii nu dovedește nimic.","lim_8":"Detectarea imaginilor generate de IA din metadate găsește doar urme declarate sau rămase. Un fișier curat poate fi totuși sintetic, iar unul marcat poate fi o fotografie reală retușată cu o unealtă de IA.","lim_9":"Interfața există în opt limbi; traducerile au fost scrise cu ajutor automat și nu au fost revizuite de vorbitori nativi. Textele în română și în engleză sunt cele de referință.","eth_1":"Fotografiile și clipurile cu persoane private pot dezvălui unde locuiesc sau lucrează. Înainte să publici un fișier, șterge metadatele de poziție și cele personale și întreabă-te dacă e necesar s F and other metadata, Content Credentials (C2PA), error-level analysis, link anatomy, hidden characters. Everything runs in your browser; nothing is uploaded.","local_note":"Files, links and text stay on this device. The only exceptions are the optional network checks below, and they run only after you tick the consent box and press their button.","h_case":"Case","lbl_title":"Case title","lbl_notes":"Notes (they appear in the report)","case_hint":"The title and the notes are kept in this browser only. Files, items and results are not saved: when you reload the page they are gone.","new_case":"New case (clear everything)","new_case_confirm":"Press again to clear everything","h_add":"Add material","drop":"Drop images or videos anywhere on this page, or choose files:","choose":"Choose files","lbl_text":"Link, domain or text (one link per line to add several)","add":"Add","examples":"Add examples","h_net":"Network checks (optional)","net_intro":"These checks need a request to a third-party service. They never run on their own.","net_note":"Sends {0} to {1} only when you press the button.","send_domain":"the domain name","send_url":"the address","send_data":"data","net_need":"Tick the consent box in the «Network checks» section first.","consent":"I understand that these checks send the data described above to the listed services, which will see my IP address and the request. I allow it, one button press at a time.","h_items":"Material","run_all":"Run all offline checks","run_net":"Run network checks","clear_results":"Clear results","summary":"{0} item(s) · {1} check(s) run · {2} need attention · {3} with problems","empty":"Nothing added yet. Add a file, a link or some text above.","run":"Run","rerun":"Run again","run_item":"Run offline checks","remove":"Remove","running":"Running…","reading":"Reading the file…","hash_wait":"calculating…","hash_big":"not calculated (file larger than 200 MB)","real_type":"real type {0}","chars":"{0} characters","add_links":"Add the {0} link(s) found as items","arch_save":"Ask the Internet Archive to save this page","arch_view":"See archived copies","copy":"Copy","copied":"Copied","copy_fail":"Could not copy","save_png":"Save as PNG","art_ela":"Error-level map: brighter = bigger difference after recompression","art_frame":"Frame {0} at {1} s","err_check":"The check failed: {0}","err_save":"Could not save the image.","h_report":"Report","report_hint":"The report lists every item and every check you ran, in this language, with the date and the limits of the method. Run the checks first: a report without results is empty.","b_rep_md":"Download report (Markdown)","b_rep_print":"Print / save as PDF","b_rep_json":"Download data (JSON)","b_rep_copy":"Copy data (JSON)","r_kind":"Type","r_size":"Size","r_real":"Real type","r_modified":"File date (last modified)","r_url":"Address","r_chars":"Characters","r_untitled":"Verification report","r_notes":"Notes","r_generated":"Generated","r_tool":"Tool","r_limits":"Limits of this report","st_added":"{0} item(s) added.","st_nothing":"Nothing to add.","st_removed":"Item removed.","st_cleared":"Results cleared.","st_new":"New case started.","st_saved":"Report saved.","st_running":"Running offline checks…","st_running_net":"Running network checks…","st_done":"Done.","st_consent_on":"Network checks enabled.","st_consent_off":"Network checks disabled.","h_limits":"What this tool cannot tell you","h_ethics":"Using it responsibly","h_more":"Go further","more_intro":"No automatic check proves that an image is genuine or fake. Combine these results with source work. Independent services you can open yourself (nothing is sent until you upload something there):","lim_1":"It cannot prove that an image or video is authentic. It can only show signs that support or contradict a claim.","lim_2":"Metadata (EXIF, XMP, IPTC) is easy to remove, copy or forge. Its absence says little; its presence is a lead, not proof. Social networks and messaging apps strip most of it.","lim_3":"Content Credentials (C2PA) are read, not validated: the signature, the certificate chain and the content hash are not checked here. Use an official verifier for that.","lim_4":"Error-level analysis is a hint: it also lights up sharp edges, saturated areas and images saved several times. Experts read it together with other evidence.","lim_5":"The link check works on the text of the address only. A web page cannot follow redirects, read TLS certificates or open the target page for you, so it cannot say whether a site is trustworthy.","lim_6":"DNS lookups show what two public resolvers answer now. They do not give the registration date or the owner of a domain.","lim_7":"The Internet Archive lookup only tells whether a copy exists and what status it had; the absence of a copy proves nothing.","lim_8":"Detecting AI-generated images from metadata only finds declared or leftover traces. A clean file can still be synthetic, and a flagged file can be a real photo edited with an AI tool.","lim_9":"The interface exists in eight languages; the translations were written with machine assistance and have not been reviewed by native speakers. The Romanian and English texts are the reference.","eth_1":"Photos and videos of private people can reveal where they live or work. Before publishing a file, remove location and personal metadata, and ask whether showing the person is necessary.","eth_2":"Do not use this tool to find where a private person lives or to profile them: a GPS position in a file is sensitive data about its author.","eth_3":"Network checks send a domain or an address to third parties (DNS resolvers, the Internet Archive). If the address itself is confidential, do not send it.","eth_4":"Keep the original file untouched, note when and where you got it, and keep the SHA-256 shown here: it lets you show later that the copy you analysed is the one you received.","lv_ok":"OK","lv_info":"Info","lv_warn":"Attention","lv_fail":"Problem","lv_skip":"Skipped","lv_error":"Error","kind_f  a web page. Check them in the browser's padlock details or in a certificate-transparency log.","f_net_error":"The request to {0} failed: {1}.","f_wayback_snapshot":"Closest archived copy: {0}, HTTP status {1}: {2}","f_wayback_error_page":"The archived copy was an error page (HTTP {0}); the page may have been removed or moved.","f_wayback_none":"No archived copy of this address was found. You can ask the Internet Archive to save it now (link on the item)."},"fr":{"title":"Atelier de vérification","nav":"Atelier","open":"Ouvrir l’atelier","intro":"Des vérifications locales pour les images, vidéos, liens et textes avant de leur faire confiance ou de les publier : structure du fichier, EXIF et autres métadonnées, Content Credentials (C2PA), analyse du niveau d'erreur, anatomie des liens, caractères cachés. Tout s'exécute dans votre navigateur ; rien n'est envoyé.","local_note":"Les fichiers, liens et textes restent sur cet appareil. Les seules exceptions sont les vérifications facultatives par le réseau ci-dessous, qui ne s'exécutent qu'après que vous avez coché le consentement et appuyé sur leur bouton.","h_case":"Dossier","lbl_title":"Titre du dossier","lbl_notes":"Notes (elles figurent dans le rapport)","case_hint":"Le titre et les notes ne sont conservés que dans ce navigateur. Les fichiers, éléments et résultats ne sont pas enregistrés : ils disparaissent au rechargement de la page.","new_case":"Nouveau dossier (tout effacer)","new_case_confirm":"Appuyez encore une fois pour tout effacer","h_add":"Ajouter du matériel","drop":"Déposez des images ou des vidéos n'importe où sur la page, ou choisissez des fichiers :","choose":"Choisir des fichiers","lbl_text":"Lien, domaine ou texte (un lien par ligne pour en ajouter plusieurs)","add":"Ajouter","examples":"Ajouter des exemples","h_net":"Vérifications par le réseau (facultatives)","net_intro":"Ces vérifications nécessitent une requête vers un service tiers. Elles ne s'exécutent jamais d'elles-mêmes.","net_note":"Envoie ze":"Taille","r_real":"Type réel","r_modified":"Date du fichier (dernière modification)","r_url":"Adresse","r_chars":"Caractères","r_untitled":"Rapport de vérification","r_notes":"Notes","r_generated":"Généré","r_tool":"Outil","r_limits":"Limites de ce rapport","st_added":"{0} élément(s) ajouté(s).","st_nothing":"Rien à ajouter.","st_removed":"Élément retiré.","st_cleared":"Résultats effacés.","st_new":"Nouveau dossier commencé.","st_saved":"Rapport enregistré.","st_running":"Vérifications hors ligne en cours…","st_running_net":"Vérifications par le réseau en cours…","st_done":"Terminé.","st_consent_on":"Vérifications par le réseau activées.","st_consent_off":"Vérifications par le réseau désactivées.","h_limits":"Ce que cet outil ne peut pas dire","h_ethics":"Une utilisation responsable","h_more":"Aller plus loin","more_intro":"Aucune vérification automatique ne prouve qu'une image est authentique ou fausse. Combinez ces résultats avec un travail sur les sources. Des services indépendants que vous ouvrez vous-même (rien n'est envoyé tant que vous n'y déposez pas quelque chose) :","lim_1":"Il ne peut pas prouver qu'une image ou une vidéo est authentique. Il montre seulement des indices qui appuient ou contredisent une affirmation.","lim_2":"Les métadonnées (EXIF, XMP, IPTC) se suppriment, se copient et se falsifient facilement. Leur absence dit peu de chose ; leur présence est une piste, pas une preuve. Les réseaux sociaux et les messageries en suppriment la plupart.","lim_3":"Les Content Credentials (C2PA) sont lus, pas validés : la signature, la chaîne de certificats et l'empreinte du contenu ne sont pas vérifiées ici. Utilisez un vérificateur officiel pour cela.","lim_4":"L'analyse du niveau d'erreur est un indice : elle éclaire aussi les contours nets, les zones saturées et les images enregistrées plusieurs fois. Les spécialistes la lisent avec d'autres éléments.","lim_5":"La vérification des liens porte uniquement sur le texte de l'adresse. Une page web ne peut ni suivre les redirections, ni lire les certificats TLS, ni ouvrir la page cible : elle ne peut donc pas dire si un site est fiable.","lim_6":"Les requêtes DNS montrent ce que répondent aujourd'hui deux résolveurs publics. Elles ne donnent ni la date d'enregistrement ni le titulaire d'un domaine.","lim_7":"La recherche dans l'Internet Archive indique seulement si une copie existe et quel était son statut ; l'absence de copie ne prouve rien.","lim_8":"La détection d'images générées par IA à partir des métadonnées ne trouve que des traces déclarées ou restantes. Un fichier propre peut quand même être synthétique, et un fichier signalé peut être une vraie photo retouchée avec un outil d'IA.","lim_9":"L'interface existe en huit langues ; les traductions ont été rédigées avec une aide automatique et n'ont pas été relues par des locuteurs natifs. Les textes roumain et anglais font foi.","eth_1":"Les photos et vidéos de personnes privées peuvent révéler où elles vivent ou travaillent. Avant de publier un fichier, supprimez les métadonnées de position et les données personnelles, et demandez-vous s'il est nécessaire de montrer la personne.","eth_2":"N'utilisez pas cet outil pour trouver où habite une personne privée ni pour la profiler : une position GPS dans un fichier est une donnée sensible sur son auteur.","eth_3":"Les vérifications par le réseau envoient un domaine ou une adresse à des tiers (résolveurs DNS, Internet Archive). Si l'adresse elle-même est confidentielle, ne l'envoyez pas.","eth_4":"Gardez le fichier original intact, notez quand et d'où vous l'avez obtenu, et conservez le SHA-256 affiché ici : il permet de montrer plus tard que la copie analysée est bien celle que vous avez reçue.","lv_ok":"OK","lv_info":"Information","lv_warn":"Attention","lv_fail":"Problème","lv_skip":"Ignoré","lv_error":"Erreur","kind_file":"Fichier","kind_image":"Image","kind_video":"Vidéo","kind_url":"Lien","kind_text":"Texte","kind_jpeg":"JPEG","kind_png":"PNG","kind_webp":"WebP","k t.","h_limits":"Was dieses Werkzeug nicht sagen kann","h_ethics":"Verantwortungsvoll verwenden","h_more":"Weiter gehen","more_intro":"Keine automatische Prüfung beweist, dass ein Bild echt oder gefälscht ist. Verbinden Sie die Ergebnisse mit Quellenarbeit. Unabhängige Dienste, die Sie selbst öffnen (es wird nichts gesendet, bis Sie dort etwas hochladen):","lim_1":"Es kann nicht beweisen, dass ein Bild oder Video echt ist. Es zeigt nur Hinweise, die eine Behauptung stützen oder ihr widersprechen.","lim_2":"Metadaten (EXIF, XMP, IPTC) lassen sich leicht entfernen, kopieren oder fälschen. Ihr Fehlen sagt wenig; ihr Vorhandensein ist ein Anhaltspunkt, kein Beweis. Soziale Netzwerke und Messenger entfernen das meiste.","lim_3":"Content Credentials (C2PA) werden gelesen, nicht validiert: Signatur, Zertifikatskette und Inhalts-Hash werden hier nicht geprüft. Verwenden Sie dafür einen offiziellen Prüfer.","lim_4":"Die Fehlerniveau-Analyse ist ein Hinweis: Sie leuchtet auch an scharfen Kanten, in gesättigten Bereichen und bei mehrfach gespeicherten Bildern auf. Fachleute lesen sie zusammen mit anderen Belegen.","lim_5":"Die Linkprüfung arbeitet nur mit dem Text der Adresse. Eine Webseite kann weder Weiterleitungen verfolgen noch TLS-Zertifikate lesen noch die Zielseite öffnen; sie kann also nicht sagen, ob eine Website vertrauenswürdig ist.","lim_6":"DNS-Abfragen zeigen, was zwei öffentliche Resolver jetzt antworten. Sie nennen weder das Registrierungsdatum noch den Inhaber einer Domain.","lim_7":"Die Internet-Archive-Suche sagt nur, ob es eine Kopie gibt und welchen Status sie hatte; das Fehlen einer Kopie beweist nichts.","lim_8":"Die Erkennung KI-generierter Bilder anhand von Metadaten findet nur angegebene oder zurückgebliebene Spuren. Eine saubere Datei kann trotzdem synthetisch sein, und eine markierte Datei kann ein echtes, mit einem KI-Werkzeug bearbeitetes Foto sein.","lim_9":"Die Oberfläche gibt es in acht Sprachen; die Übersetzungen wurden mit maschineller Hilfe erstellt und nicht von Muttersprachlern geprüft. Maßgeblich sind die rumänischen und englischen Texte.","eth_1":"Fotos und Videos von Privatpersonen können verraten, wo sie wohnen oder arbeiten. Entfernen Sie vor dem Veröffentlichen Standort- und persönliche Metadaten und fragen Sie sich, ob es nötig ist, die Person zu zeigen.","eth_2":"Nutzen Sie das Werkzeug nicht, um herauszufinden, wo eine Privatperson wohnt, oder um sie zu profilieren: Eine GPS-Position in einer Datei ist ein sensibles Datum über deren Urheber.","eth_3":"Netzwerkprüfungen senden eine Domain oder Adresse an Dritte (DNS-Resolver, Internet Archive). Ist die Adresse selbst vertraulich, senden Sie sie nicht.","eth_4":"Lassen Sie die Originaldatei unverändert, notieren Sie, wann und woher Sie sie haben, und bewahren Sie den hier angezeigten SHA-256 auf: Er erlaubt später den Nachweis, dass die analysierte Kopie die erhaltene ist.","lv_ok":"In Ordnung","lv_info":"Info","lv_warn":"Achtung","lv_fail":"Problem","lv_skip":"Übersprungen","lv_error":"Fehler","kind_file":"Datei","kind_image":"Bild","kind_video":"Video","kind_url":"Link","kind_text":"Text","kind_jpeg":"JPEG","kind_png":"PNG","kind_webp":"WebP","kind_gif":"GIF","kind_tiff":"TIFF","kind_heic":"HEIC","kind_avif":"AVIF","kind_bmp":"BMP","kind_mp4":"MP4","kind_mov":"MOV","kind_webm":"WebM","kind_avi":"AVI","kind_pdf":"PDF","kind_unknown":"eine nicht erkannte Datei","skip_kind":"gilt nicht für {0}","skip_other":"gilt nicht ({0})","skip_no-dom":"benötigt Browserfunktionen, die hier nicht verfügbar sind","skip_no-net":"Netzwerkprüfungen sind in diesem Browser nicht verfügbar","skip_no-domain":"dieser Eintrag ist kein Domainname","skip_no-url":"dieser Eintrag ist keine Webadresse","skip_too-large":"die Datei ist größer als 200 MB und wird nicht in den Speicher gelesen","iptc_title":"Titel","iptc_caption":"Bildunterschrift","iptc_byline":"Urheber (Byline)","iptc_credit":"Credit","iptc_source":"Quelle","iptc_copyright":"Urheberrecht","iptc_city":"Stadt", robación ejecutada, en este idioma, con la fecha y los límites del método. Ejecuta primero las comprobaciones: un informe sin resultados está vacío.","b_rep_md":"Descargar informe (Markdown)","b_rep_print":"Imprimir / guardar como PDF","b_rep_json":"Descargar datos (JSON)","b_rep_copy":"Copiar datos (JSON)","r_kind":"Tipo","r_size":"Tamaño","r_real":"Tipo real","r_modified":"Fecha del archivo (última modificación)","r_url":"Dirección","r_chars":"Caracteres","r_untitled":"Informe de verificación","r_notes":"Notas","r_generated":"Generado","r_tool":"Herramienta","r_limits":"Límites de este informe","st_added":"{0} elemento(s) añadido(s).","st_nothing":"Nada que añadir.","st_removed":"Elemento quitado.","st_cleared":"Resultados borrados.","st_new":"Caso nuevo iniciado.","st_saved":"Informe guardado.","st_running":"Ejecutando comprobaciones sin conexión…","st_running_net":"Ejecutando comprobaciones por red…","st_done":"Hecho.","st_consent_on":"Comprobaciones por red activadas.","st_consent_off":"Comprobaciones por red desactivadas.","h_limits":"Lo que esta herramienta no puede decirte","h_ethics":"Uso responsable","h_more":"Ir más allá","more_intro":"Ninguna comprobación automática demuestra que una imagen sea auténtica o falsa. Combina estos resultados con trabajo sobre las fuentes. Servicios independientes que abres tú mismo (no se envía nada hasta que subes algo allí):","lim_1":"No puede demostrar que una imagen o un vídeo sea auténtico. Solo muestra indicios que respaldan o contradicen una afirmación.","lim_2":"Los metadatos (EXIF, XMP, IPTC) se borran, copian y falsifican con facilidad. Su ausencia dice poco; su presencia es una pista, no una prueba. Las redes sociales y las aplicaciones de mensajería eliminan la mayoría.","lim_3":"Los Content Credentials (C2PA) se leen, no se validan: la firma, la cadena de certificados y el hash del contenido no se comprueban aquí. Para eso usa un verificador oficial.","lim_4":"El análisis de nivel de error es un indicio: también ilumina bordes nítidos, zonas saturadas e imágenes guardadas varias veces. Los especialistas lo leen junto con otras pruebas.","lim_5":"La comprobación de enlaces trabaja solo con el texto de la dirección. Una página web no puede seguir redirecciones, leer certificados TLS ni abrir la página de destino, así que no puede decir si un sitio es fiable.","lim_6":"Las consultas DNS muestran lo que responden ahora dos resolutores públicos. No dan la fecha de registro ni el titular de un dominio.","lim_7":"La búsqueda en Internet Archive solo dice si existe una copia y qué estado tenía; la ausencia de copia no prueba nada.","lim_8":"La detección de imágenes generadas por IA a partir de metadatos solo encuentra rastros declarados o residuales. Un archivo limpio puede ser sintético, y uno marcado puede ser una foto real retocada con una herramienta de IA.","lim_9":"La interfaz existe en ocho idiomas; las traducciones se escribieron con ayuda automática y no las han revisado hablantes nativos. Los textos en rumano e inglés son la referencia.","eth_1":"Las fotos y vídeos de personas privadas pueden revelar dónde viven o trabajan. Antes de publicar un archivo, elimina los metadatos de ubicación y personales, y pregúntate si es necesario mostrar a la persona.","eth_2":"No uses la herramienta para averiguar dónde vive una persona privada ni para elaborar su perfil: una posición GPS en un archivo es un dato sensible sobre su autor.","eth_3":"Las comprobaciones por red envían un dominio o una dirección a terceros (resolutores DNS, Internet Archive). Si la propia dirección es confidencial, no la envíes.","eth_4":"Conserva el archivo original intacto, anota cuándo y de dónde lo obtuviste y guarda el SHA-256 que se muestra aquí: permite demostrar después que la copia analizada es la que recibiste.","lv_ok":"Correcto","lv_info":"Información","lv_warn":"Atención","lv_fail":"Problema","lv_skip":"Omitido","lv_error":"Error","kind_file":"Archivo","kind_image":"Imagen","kind_video":"Vídeo", o, no una prueba.","f_ela_too_big":"La imagen ({0} × {1}) es demasiado grande para el análisis en el navegador.","f_ela_too_small":"La imagen ({0} × {1}) es demasiado pequeña para un análisis significativo.","f_video_container":"Contenedor: {0} {1}.","f_video_duration":"Duración: {0} s.","f_video_created":"Fecha de creación guardada en el archivo: {0}.","f_video_modified":"Fecha de modificación guardada en el archivo: {0}.","f_video_location":"Ubicación guardada en el archivo: {0}. Compruébala en un mapa; puede revelar dónde se grabó el clip.","f_video_editor":"Escrito por {0}, una herramienta de edición o conversión ({1}): el clip probablemente se volvió a exportar.","f_video_tool":"Escrito por: {0}.","f_video_reencoded":"Hay una firma de herramienta de recodificación ({0}): el clip probablemente se convirtió después de grabarlo.","f_video_stripped":"El archivo no tiene fecha de creación ni ubicación: típico de clips que pasaron por una aplicación de mensajería o una red social.","f_video_unreadable":"No se pudo leer el contenedor de vídeo ({0}).","f_video_frames":"{0} fotogramas extraídos de un clip de {1} s. Úsalos para una búsqueda inversa de imágenes o para comparar con otras fuentes.","f_video_size":"Tamaño del vídeo: {0} × {1} píxeles.","f_video_unsupported":"Este navegador no puede decodificar este vídeo {0}, así que no se extrajeron fotogramas.","f_url_invalid":"No es una dirección web válida: «{0}».","f_url_parsed":"Abre una página en {0} (ruta {1}).","f_url_assumed":"No se indicó esquema; se supuso https://.","f_url_http":"La dirección usa http:// sin cifrar.","f_url_userinfo":"La dirección contiene «{0}@» antes del servidor real: el navegador va a {1}, no a lo que hay antes de la @. Un disfraz clásico.","f_url_ip_obfuscated":"El servidor es una dirección IP escrita de forma inusual; apunta a {0}.","f_url_ip":"El servidor es una dirección IP desnuda ({0}) en lugar de un nombre de dominio.","f_url_private":"La dirección IP ({0}) pertenece a un rango privado o de red local: no puede ser un sitio público.","f_url_idn":"Nombre de dominio internacionalizado: se muestra «{0}»; el nombre real es {1}.","f_url_mixed":"El dominio mezcla alfabetos ({0}), una señal frecuente de direcciones con letras parecidas (homógrafos).","f_url_lookalike":"El dominio usa letras de otro alfabeto que se parecen a las latinas; en latín simple se lee «{0}».","f_url_shortener":"Acortador de enlaces ({0}): el destino final está oculto. No lo abras a ciegas; usa un servicio que expanda enlaces o comprueba adónde lleva.","f_url_tracking":"Parámetros de seguimiento encontrados: {0}. Dirección limpia: {1}","f_url_port":"Puerto no estándar: {0}.","f_url_deep":"Nombre de servidor muy profundo ({0} niveles): el dominio real son las dos últimas partes.","f_url_long":"Dirección muy larga ({0} caracteres).","f_url_redirects":"Esta comprobación no sigue redirecciones, no lee certificados ni abre la página: una página web no puede hacerlo. Usa los enlaces de archivo para ver lo que mostraba la página antes.","f_text_stats":"{0} caracteres, {1} palabras.","f_text_clean":"No se encontraron caracteres ocultos ni parecidos en {0} caracteres ({1} palabras).","f_text_tags":"{0} carácter(es) invisible(s) de tipo «etiqueta»: pueden esconder un mensaje o instrucciones dentro del texto.","f_text_invisible":"{0} carácter(es) invisible(s): {1}. El texto copiado puede parecer idéntico y aun así ser distinto.","f_text_bidi":"{0} carácter(es) de control de dirección del texto ({1}): pueden hacer que el texto se muestre en un orden distinto al almacenado (técnica «Trojan source»).","f_text_joiners":"{0} carácter(es) de unión; normal en algunas escrituras y en los emoji.","f_text_mixed":"{0} palabra(s) mezclan alfabetos: {1}","f_text_lookalike":"{0} palabra(s) están escritas enteramente con letras parecidas de otro alfabeto: {1}","f_text_oddspaces":"{0} espacio(s) inusual(es) (de no separación, fino, ideográfico).","f_text_controls":"{0} carácter(es) de control que no son saltos de línea ni tabuladores normales.","f_text_urls":"{0} dirección(es) web encontrada(s) en el texto. Puedes añadirlas como elementos aparte para comprobarlas.","f_dns_nxdomain":"El dominio {0} no existe en el DNS (NXDOMAIN).","f_dns_rcode":"El resolutor respondió con el estado {0}.","f_dns_address":"Direcciones: IPv4 {0} · IPv6 {1}.","f_dns_ns":"Servidores de nombres: {0}.","f_dns_mail":"Correo: {0} registro(s) MX · SPF {1} · DMARC {2}.","f_dns_caa":"CAA (qué autoridades pueden emitir certificados): {0}.","f_dns_dnssec":"El resolutor indica que la respuesta está validada con DNSSEC.","f_dns_nodnssec":"La respuesta no se validó con DNSSEC (muchos dominios simplemente no están firmados).","f_dns_partial":"Algunas consultas fallaron ({0}); no leas los registros que faltan como inexistentes.","f_dns_mismatch":"Los dos resolutores devuelven direcciones distintas (Cloudflare: {0} · Google: {1}). Puede ser normal (reparto de carga, respuestas geográficas) o señal de interferencia.","f_dns_agree":"Ambos resolutores devuelven las mismas direcciones IPv4.","f_dns_single":"Solo respondió {0}, así que no fue posible contrastar entre resolutores.","f_dns_tls":"Los certificados TLS no se pueden leer desde una página web. Compruébalos en los detalles del candado del navegador o en un registro de transparencia de certificados.","f_net_error":"La petición a {0} falló: {1}.","f_wayback_snapshot":"Copia archivada más cercana: {0}, estado HTTP {1}: {2}","f_wayback_error_page":"La copia archivada era una página de error (HTTP {0}); la página puede haberse eliminado o movido.","f_wayback_none":"No se encontró ninguna copia archivada de esta dirección. Puedes pedir a Internet Archive que la guarde ahora (enlace en el elemento)."},"it":{"title":"Laboratorio di verifica","nav":"Laboratorio","open":"Apri il laboratorio","intro":"Controlli locali per immagini, video, link e testi prima di fidarsene o di pubblicarli: struttura del file, EXIF e altri metadati, Content Credentials (C2PA), analisi del livello di errore, anatomia dei link, caratteri nascosti. Tutto funziona nel tuo browser; non viene caricato nulla.","local_note":"File, link e testi restano su questo dispositivo. Le uniche eccezioni sono i controlli facoltativi via rete qui sotto, che partono solo dopo aver spuntato il consenso e premuto il loro pulsante.","h_case":"Caso","lbl_title":"Titolo del caso","lbl_notes":"Note (compaiono nel rapporto)","case_hint":"Il titolo e le note restano solo in questo browser. File, elementi e risultati non vengono salvati: ricaricando la pagina spariscono.","new_case":"Nuovo caso (cancella tutto)","new_case_confirm":"Premi ancora per cancellare tutto","h_add":"Aggiungi materiale","drop":"Trascina immagini o video in un punto qualsiasi della pagina, oppure scegli dei file:","choose":"Scegli file","lbl_text":"Link, dominio o testo (un link per riga per aggiungerne più d'uno)","add":"Aggiungi","examples":"Aggiungi esempi","h_net":"Controlli via rete (facoltativi)","net_intro":"Questi controlli richiedono una richiesta a un servizio di terzi. Non partono mai da soli.","net_note":"Invia {0} a {1} solo quando premi il pulsante.","send_domain":"il nome di dominio","send_url":"l'indirizzo","send_data":"dei dati","net_need":"Spunta prima il consenso nella sezione «Controlli via rete».","consent":"Capisco che questi controlli inviano i dati descritti sopra ai servizi elencati, che vedranno il mio indirizzo IP e la richiesta. Acconsento, a ogni pressione di pulsante.","h_items":"Materiale","run_all":"Esegui tutti i controlli offline","run_net":"Esegui i controlli via rete","clear_results":"Cancella i risultati","summary":"{0} elemento/i · {1} controllo/i eseguito/i · {2} richiedono attenzione · {3} con problemi","empty":"Ancora nulla. Aggiungi qui sopra un file, un link o un testo.","run":"Esegui","rerun":"Esegui di nuovo","run_item":"Esegui i controlli offline","remove":"Rimuovi","running":"In corso…","reading":"Lettura del file…","hash_wait":"calcolo in corso…","hash_big":"non calcolato (file oltre 200 MB)","real_type":"tipo reale {0}","chars":"{0} caratteri","add_links":"Aggiungi come elementi i {0} link trovato/i","arch_save":"Chiedi a Internet Archive di salvare questa pagina","arch_view":"Vedi le copie archiviate","copy":"Copia","copied":"Copiato","copy_fail":"Copia non riuscita","save_png":"Salva come PNG","art_ela":"Mappa del livello di errore: più chiaro = differenza maggiore dopo la ricompressione","art_frame":"Fotogramma {0} a {1} s","err_check":"Il controllo è fallito: {0}","err_save":"Impossibile salvare l'immagine.","h_report":"Rapporto","report_hint":"Il rapporto elenca ogni elemento e ogni controllo eseguito, in questa lingua, con la data e i limiti del metodo. Esegui prima i controlli: un rapporto senza risultati è vuoto.","b_rep_md":"Scarica il rapporto (Markdown)","b_rep_print":"Stampa / salva come PDF","b_rep_json":"Scarica i dati (JSON)","b_rep_copy":"Copia i dati (JSON)","r_kind":"Tipo","r_size":"Dimensione","r_real":"Tipo reale","r_modified":"Data del file (ultima modifica)","r_url":"Indirizzo","r_chars":"Caratteri","r_untitled":"Rapporto di verifica","r_notes":"Note","r_generated":"Generato","r_tool":"Strumento","r_limits":"Limiti di questo rapporto","st_added":"{0} elemento/i aggiunto/i.","st_nothing":"Niente da aggiungere.","st_removed":"Elemento rimosso.","st_cleared":"Risultati cancellati.","st_new":"Nuovo caso avviato.","st_saved":"Rapporto salvato.","st_running":"Controlli offline in corso…","st_running_net":"Controlli via rete in corso…","st_done":"Fatto.","st_consent_on":"Controlli via rete attivati.","st_consent_off":"Controlli via rete disattivati.","h_limits":"Cosa questo strumento non può dirti","h_ethics":"Usarlo con responsabilità","h_more":"Andare oltre","more_intro":"Nessun controllo automatico dimostra che un'immagine sia autentica o falsa. Combina questi risultati con il lavoro sulle fonti. Servizi indipendenti che apri tu stesso (non viene inviato nulla finché non carichi qualcosa lì):","lim_1":"Non può dimostrare che un'immagine o un video sia autentico. Mostra solo indizi che sostengono o contraddicono un'affermazione.","lim_2":"I metadati (EXIF, XMP, IPTC) si cancellano, copiano e falsificano facilmente. La loro assenza dice poco; la loro presenza è una pista, non una prova. I social network e le app di messaggistica ne eliminano la maggior parte.","lim_3":"I Content Credentials (C2PA) vengono letti, non validati: firma, catena di certificati e impronta del contenuto non sono verificate qui. Per questo usa un verificatore ufficiale.","lim_4":"L'analisi del livello di errore è un indizio: illumina anche bordi netti, zone sature e immagini salvate più volte. Gli esperti la leggono insieme ad altre prove.","lim_5":"Il controllo dei link lavora solo sul testo dell'indirizzo. Una pagina web non può seguire i reindirizzamenti, leggere i certificati TLS né aprire la pagina di destinazione, quindi non può dire se un sito sia affidabile.","lim_6":"Le interrogazioni DNS mostrano cosa rispondono ora due risolutori pubblici. Non danno la data di registrazione né il titolare di un dominio.","lim_7":"La ricerca su Internet Archive dice solo se esiste una copia e quale stato avesse; l'assenza di una copia non prova nulla.","lim_8":"Il riconoscimento di immagini generate dall'IA dai metadati trova solo tracce dichiarate o residue. Un file pulito può comunque essere sintetico, e uno segnalato può essere una foto vera ritoccata con uno strumento di IA.","lim_9":"L'interfaccia esiste in otto lingue; le traduzioni sono state scritte con assistenza automatica e non sono state riviste da madrelingua. I testi in rumeno e in inglese fanno fede.","eth_1":"Foto e video di persone private possono rivelare dove vivono o lavorano. Prima di pubblicare un file, rimuovi i metadati di posizione e personali e chiediti se sia necessario mostrare la persona.","eth_2":"Non usare lo strumento per scoprire dove abita una persona privata né per profilarla: una posizione GPS in un fi running_net":"Hálózati ellenőrzések futnak…","st_done":"Kész.","st_consent_on":"Hálózati ellenőrzések bekapcsolva.","st_consent_off":"Hálózati ellenőrzések kikapcsolva.","h_limits":"Amit ez az eszköz nem mondhat meg","h_ethics":"Felelős használat","h_more":"Tovább","more_intro":"Egyetlen automatikus ellenőrzés sem bizonyítja, hogy egy kép valódi vagy hamis. Kapcsold össze az eredményeket forrásmunkával. Független szolgáltatások, amelyeket te nyitsz meg (addig nem megy el semmi, amíg te nem töltesz fel valamit):","lim_1":"Nem bizonyíthatja, hogy egy kép vagy videó hiteles. Csak olyan jeleket mutat, amelyek egy állítást támogatnak vagy cáfolnak.","lim_2":"A metaadatok (EXIF, XMP, IPTC) könnyen törölhetők, másolhatók és hamisíthatók. A hiányuk keveset mond; a meglétük nyom, nem bizonyíték. A közösségi hálózatok és üzenetküldők a legtöbbet eltávolítják.","lim_3":"A Content Credentials (C2PA) adatokat olvassa, de nem érvényesíti: az aláírást, a tanúsítványláncot és a tartalom kivonatát itt nem ellenőrzi. Ehhez használj hivatalos ellenőrzőt.","lim_4":"A hibaszint-elemzés csak jelzés: kiemeli az éles éleket, a telített területeket és a többször mentett képeket is. A szakértők más bizonyítékokkal együtt olvassák.","lim_5":"A hivatkozás-ellenőrzés csak a cím szövegével dolgozik. Egy weboldal nem tud átirányításokat követni, TLS-tanúsítványokat olvasni vagy megnyitni a célt, ezért nem mondhatja meg, hogy egy webhely megbízható-e.","lim_6":"A DNS-lekérdezések azt mutatják, mit válaszol most két nyilvános feloldó. Nem adják meg a tartomány regisztrációjának dátumát vagy tulajdonosát.","lim_7":"Az Internet Archive-keresés csak azt mondja meg, van-e másolat és milyen állapotú volt; a másolat hiánya semmit sem bizonyít.","lim_8":"A mesterséges intelligenciával készült képek metaadatokból történő felismerése csak a bevallott vagy a hátramaradt nyomokat találja meg. Egy tiszta fájl is lehet szintetikus, a megjelölt pedig lehet valódi fotó, amelyet MI-eszközzel szerkesztettek.","lim_9":"A felület nyolc nyelven érhető el; a fordításokat gépi segítséggel írtuk, anyanyelvi beszélők nem ellenőrizték őket. A román és az angol szöveg a mérvadó.","eth_1":"Magánszemélyekről készült fotók és videók elárulhatják, hol laknak vagy dolgoznak. Közzététel előtt távolítsd el a helyadatokat és a személyes metaadatokat, és gondold végig, szükséges-e megmutatni az illetőt.","eth_2":"Ne használd az eszközt arra, hogy kiderítsd, hol lakik egy magánszemély, vagy hogy profilt készíts róla: egy fájlban lévő GPS-pozíció érzékeny adat a készítőjéről.","eth_3":"A hálózati ellenőrzések tartományt vagy címet küldenek harmadik feleknek (DNS-feloldók, Internet Archive). Ha maga a cím bizalmas, ne küldd el.","eth_4":"Hagyd érintetlenül az eredeti fájlt, jegyezd fel, mikor és honnan szerezted, és őrizd meg az itt látható SHA-256 értéket: később ezzel igazolható, hogy az elemzett példány az, amit kaptál.","lv_ok":"Rendben","lv_info":"Információ","lv_warn":"Figyelem","lv_fail":"Probléma","lv_skip":"Kihagyva","lv_error":"Hiba","kind_file":"Fájl","kind_image":"Kép","kind_video":"Videó","kind_url":"Hivatkozás","kind_text":"Szöveg","kind_jpeg":"JPEG","kind_png":"PNG","kind_webp":"WebP","kind_gif":"GIF","kind_tiff":"TIFF","kind_heic":"HEIC","kind_avif":"AVIF","kind_bmp":"BMP","kind_mp4":"MP4","kind_mov":"MOV","kind_webm":"WebM","kind_avi":"AVI","kind_pdf":"PDF","kind_unknown":"egy fel nem ismert fájl","skip_kind":"nem vonatkozik erre: {0}","skip_other":"nem vonatkozik rá ({0})","skip_no-dom":"olyan böngészőfunkciókat igényel, amelyek itt nem érhetők el","skip_no-net":"a hálózati ellenőrzések ebben a böngészőben nem érhetők el","skip_no-domain":"ez a tétel nem tartománynév","skip_no-url":"ez a tétel nem webcím","skip_too-large":"a fájl nagyobb 200 MB-nál, ezért nem töltődik a memóriába","iptc_title":"Cím","iptc_caption":"Képaláírás","iptc_byline":"Szerző (byline)","iptc_credit":"Forrásmegjelölés","iptc_source":"Forrás","iptc_copyright":"Szerzői jog","iptc_city":"Város","iptc_country": nt Credentials (C2PA), análise do nível de erro, anatomia das ligações, caracteres ocultos. Tudo corre no seu navegador; nada é enviado.","local_note":"Os ficheiros, ligações e textos ficam neste dispositivo. As únicas exceções são as verificações opcionais pela rede abaixo, que só correm depois de assinalar o consentimento e premir o respetivo botão.","h_case":"Caso","lbl_title":"Título do caso","lbl_notes":"Notas (aparecem no relatório)","case_hint":"O título e as notas ficam guardados apenas neste navegador. Os ficheiros, os elementos e os resultados não são guardados: ao recarregar a página desaparecem.","new_case":"Novo caso (apaga tudo)","new_case_confirm":"Prima outra vez para apagar tudo","h_add":"Adicionar material","drop":"Largue imagens ou vídeos em qualquer ponto da página, ou escolha ficheiros:","choose":"Escolher ficheiros","lbl_text":"Ligação, domínio ou texto (uma ligação por linha para adicionar várias)","add":"Adicionar","examples":"Adicionar exemplos","h_net":"Verificações pela rede (opcionais)","net_intro":"Estas verificações precisam de um pedido a um serviço de terceiros. Nunca correm sozinhas.","net_note":"Envia {0} para {1} apenas quando prime o botão.","send_domain":"o nome de domínio","send_url":"o endereço","send_data":"dados","net_need":"Assinale primeiro o consentimento na secção «Verificações pela rede».","consent":"Compreendo que estas verificações enviam os dados descritos acima para os serviços indicados, que verão o meu endereço IP e o pedido. Autorizo, a cada clique num botão.","h_items":"Material","run_all":"Executar todas as verificações offline","run_net":"Executar as verificações pela rede","clear_results":"Limpar resultados","summary":"{0} elemento(s) · {1} verificação(ões) executada(s) · {2} pedem atenção · {3} com problemas","empty":"Ainda não há nada. Adicione acima um ficheiro, uma ligação ou um texto.","run":"Executar","rerun":"Executar de novo","run_item":"Executar verificações offline","remove":"Remover","running":"A executar…","reading":"A ler o ficheiro…","hash_wait":"a calcular…","hash_big":"não calculado (ficheiro com mais de 200 MB)","real_type":"tipo real {0}","chars":"{0} caracteres","add_links":"Adicionar como elementos as {0} ligação(ões) encontrada(s)","arch_save":"Pedir ao Internet Archive que guarde esta página","arch_view":"Ver cópias arquivadas","copy":"Copiar","copied":"Copiado","copy_fail":"Não foi possível copiar","save_png":"Guardar como PNG","art_ela":"Mapa do nível de erro: mais claro = maior diferença após recompressão","art_frame":"Fotograma {0} aos {1} s","err_check":"A verificação falhou: {0}","err_save":"Não foi possível guardar a imagem.","h_report":"Relatório","report_hint":"O relatório enumera cada elemento e cada verificação executada, neste idioma, com a data e os limites do método. Execute primeiro as verificações: um relatório sem resultados está vazio.","b_rep_md":"Descarregar relatório (Markdown)","b_rep_print":"Imprimir / guardar como PDF","b_rep_json":"Descarregar dados (JSON)","b_rep_copy":"Copiar dados (JSON)","r_kind":"Tipo","r_size":"Tamanho","r_real":"Tipo real","r_modified":"Data do ficheiro (última modificação)","r_url":"Endereço","r_chars":"Caracteres","r_untitled":"Relatório de verificação","r_notes":"Notas","r_generated":"Gerado","r_tool":"Ferramenta","r_limits":"Limites deste relatório","st_added":"{0} elemento(s) adicionado(s).","st_nothing":"Nada para adicionar.","st_removed":"Elemento removido.","st_cleared":"Resultados limpos.","st_new":"Novo caso iniciado.","st_saved":"Relatório guardado.","st_running":"A executar verificações offline…","st_running_net":"A executar verificações pela rede…","st_done":"Concluído.","st_consent_on":"Verificações pela rede ativadas.","st_consent_off":"Verificações pela rede desativadas.","h_limits":"O que esta ferramenta não pode dizer","h_ethics":"Utilização responsável","h_more":"Ir mais longe","more_intro":"Nenhuma verificação automática prova que uma imagem é autêntica ou falsa. Combine estes resultados com trabalho sobre as fontes. Serviços independentes que abre você mesmo (nada é enviado até carregar lá alguma coisa):","lim_1":"Não pode provar que uma imagem ou um vídeo é autêntico. Só mostra indícios que apoiam ou contrariam uma afirmação.","lim_2":"Os metadados (EXIF, XMP, IPTC) apagam-se, copiam-se e falsificam-se com facilidade. A sua ausência diz pouco; a sua presença é uma pista, não uma prova. As redes sociais e as aplicações de mensagens removem a maior parte.","lim_3":"Os Content Credentials (C2PA) são lidos, não validados: a assinatura, a cadeia de certificados e o hash do conteúdo não são verificados aqui. Para isso use um verificador oficial.","lim_4":"A análise do nível de erro é um indício: também ilumina arestas nítidas, zonas saturadas e imagens guardadas várias vezes. Os especialistas leem-na juntamente com outras provas.","lim_5":"A verificação de ligações trabalha apenas sobre o texto do endereço. Uma página web não consegue seguir redirecionamentos, ler certificados TLS nem abrir a página de destino, pelo que não pode dizer se um sítio é de confiança.","lim_6":"As consultas DNS mostram o que respondem agora dois resolvedores públicos. Não dão a data de registo nem o titular de um domínio.","lim_7":"A pesquisa no Internet Archive só diz se existe uma cópia e que estado tinha; a ausência de cópia não prova nada.","lim_8":"A deteção de imagens geradas por IA a partir dos metadados só encontra vestígios declarados ou remanescentes. Um ficheiro limpo pode ser sintético, e um assinalado pode ser uma fotografia real retocada com uma ferramenta de IA.","lim_9":"A interface existe em oito idiomas; as traduções foram escritas com ajuda automática e não foram revistas por falantes nativos. Os textos em romeno e em inglês são a referência.","eth_1":"Fotografias e vídeos de pessoas privadas podem revelar onde vivem ou trabalham. Antes de publicar um ficheiro, remova os metadados de localização e pessoais e pergunte-se se é necessário mostrar a pess PLUGINS["c2pa-reader"]=(function(){
// Content Credentials (C2PA): detectează și citește manifestele din fișier, fără rețea. NU validează semnătura, lanțul de certificate sau amprenta pixelilor.
// Pentru validare folosește un verificator oficial (Content Credentials Verify, c2patool).
async function run(file, ctx) {
  const L = ctx.lib, b = await ctx.bytes(), F = [], kind = L.sniff(b);
  if (['jpeg', 'png', 'webp', 'mp4', 'mov', 'heic', 'avif'].indexOf(kind) < 0) return L.skip(kind);
  let c;
  try { c = L.readC2pa(b); } catch (e) { return L.result([L.finding('c2pa.malformed', 'warn', [String(e && e.message || e).slice(0, 80)])], {present: true}); }
  if (!c) return L.result([L.finding('c2pa.none', 'info', [])], {present: false});
  const data = {present: true, where: c.where, manifests: c.manifests.length, active: c.activeLabel, validated: false};
  if (!c.manifests.length) {
    F.push(L.finding('c2pa.malformed', 'warn', [c.problems.slice(0, 3).join(', ')]));
    return L.result(F, data);
  }
  const act = c.manifests[c.manifests.length - 1];
  F.push(L.finding('c2pa.found', 'info', [c.manifests.length, act.label || '—']));
  const gen = act.generatorInfo.length ? act.generatorInfo.join('; ') : act.generator;
  if (gen) { data.generator = gen; F.push(L.finding('c2pa.generator', 'info', [gen])); }
  if (act.title) F.push(L.finding('c2pa.title', 'info', [act.title]));
  if (act.actions.length) {
    const names = [];
    act.actions.forEach((a) => { const k = a.action.replace(/^c2pa\./, ''); if (k && names.indexOf(k) < 0) names.push(k); });
    data.actions = names;
    F.push(L.finding('c2pa.actions', 'info', [names.slice(0, 12).join(', ')]));
    const tools = [];
    act.actions.forEach((a) => { if (a.tool && tools.indexOf(a.tool) < 0) tools.push(a.tool); });
    if (tools.length) F.push(L.finding('c2pa.tools', 'info', [tools.slice(0, 5).join('; ')]));
  }
  const ai = act.aiSourceTypes.slice();
  c.manifests.forEach((m) => m.aiSourceTypes.forEach((x) => { if (ai.indexOf(x) < 0) ai.push(x); }));
  L.aiMentions(gen + ' ' + act.actions.map((a) => a.tool).join(' ')).forEach((x) => { if (ai.indexOf(x) < 0) ai.push(x); });
  if (ai.length) { data.ai = ai; F.push(L.finding('c2pa.ai', 'warn', [ai.join(', ')])); }
  if (act.ingredients.length) F.push(L.finding('c2pa.ingredients', 'info', [act.ingredients.length, act.ingredients.slice(0, 3).map((x) => x.title || x.relationship || '—').join('; ')]));
  if (c.manifests.length > 1) F.push(L.finding('c2pa.history', 'info', [c.manifests.length - 1]));
  if (act.signer) {
    data.signer = {subject: act.signer.subject, issuer: act.signer.issuer, alg: act.signer.alg, from: act.signer.notBefore, to: act.signer.notAfter};
    F.push(L.finding('c2pa.signer', 'info', [act.signer.subject || '—', act.signer.issuer || '—', act.signer.alg || '—', (act.signer.notBefore || '—').slice(0, 10), (act.signer.notAfter || '—').slice(0, 10)]));
  } else F.push(L.finding('c2pa.nosigner', 'warn', []));
  F.push(act.hasHardBinding ? L.finding('c2pa.hardbinding', 'info', [act.hashAlg || '—']) : L.finding('c2pa.nobinding', 'warn', []));
  if (c.problems.length) F.push(L.finding('c2pa.malformed', 'warn', [c.problems.slice(0, 3).join(', ')]));
  F.push(L.finding('c2pa.notvalidated', 'warn', []));
  return L.result(F, data);
}

return {run:run};
})();
